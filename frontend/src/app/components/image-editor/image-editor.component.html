<div class="card">
  <div class="card-title">🖼️ Image Editor</div>

  <div class="row-fields">
    <mat-form-field appearance="outline" class="field-half">
      <mat-label>Template</mat-label>
      <mat-select [(ngModel)]="selectedTemplate">
        <mat-option *ngFor="let t of templates" [value]="t.file">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="upload-area field-half">
      <button mat-stroked-button (click)="fileInput.click()" class="upload-btn">
        <mat-icon>upload</mat-icon>
        {{ selectedFile ? selectedFile.name : 'Upload News Photo' }}
      </button>
      <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)">
    </div>
  </div>

  <!-- Image size warning -->
  <div class="size-warning" *ngIf="imageSizeWarning">
    <mat-icon>warning_amber</mat-icon>
    <span>Image is larger than 5MB. It may take longer to process.</span>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Image Caption (shown on banner)</mat-label>
    <input matInput [ngModel]="caption" (ngModelChange)="onCaptionChange($event)" placeholder="Short caption for the image...">
  </mat-form-field>

  <div class="action-row">
    <button mat-stroked-button (click)="generatePreview()" [disabled]="isGenerating">
      <mat-spinner *ngIf="isGenerating" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!isGenerating">preview</mat-icon>
      {{ isGenerating ? 'Generating...' : 'Generate Preview' }}
    </button>

    <button mat-raised-button color="primary" (click)="downloadImage()" [disabled]="!previewUrl" class="download-btn">
      <mat-icon>download</mat-icon> Download Image
    </button>
  </div>

  <div class="preview-container" *ngIf="previewUrl">
    <img [src]="previewUrl" alt="Generated news image" class="preview-img">
  </div>

  <div class="preview-placeholder" *ngIf="!previewUrl">
    <mat-icon>image</mat-icon>
    <span>Image preview will appear here</span>
  </div>
</div>
